{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto mt-20 bg-secondary-dark p-10 rounded-2xl shadow-2xl border border-red-600 relative overflow-hidden">

    <!-- Optional warning icon or background effect -->
    <div class="absolute top-4 right-4 text-red-500 text-6xl opacity-10 pointer-events-none">
        ⚠️
    </div>

    <h2 class="text-4xl font-extrabold text-red-500 mb-6 tracking-wide text-center">
        Payment Failed
    </h2>

    <div class="bg-primary-dark p-6 rounded-xl mb-8 shadow-inner border border-red-700">
        <p class="text-gray-300 text-lg">Payment ID:</p>
        <p class="text-xl font-bold text-white mb-4">{{ payment.payment_id }}</p>

        <p class="text-gray-300 text-lg">Amount:</p>
        <p class="text-3xl font-black text-accent-luxury">₹{{ payment.amount }}</p>
    </div>

    <div class="flex flex-col sm:flex-row gap-6 justify-center">
        <a href="{% url 'mock_payment' payment.payment_id %}"
           class="w-full sm:w-auto text-center bg-accent-luxury hover:bg-accent-hover text-primary-dark font-bold px-8 py-3 rounded-2xl text-lg transition shadow-lg transform hover:scale-[1.02]">
            Retry Payment
        </a>

        <a href="{% url 'cart_view' %}"
           class="w-full sm:w-auto text-center bg-card-dark hover:bg-secondary-dark border border-accent-luxury px-8 py-3 rounded-2xl text-lg font-semibold transition shadow-lg transform hover:scale-[1.02]">
            Back to Cart
        </a>
    </div>

</div>

{% endblock %}
