{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto mt-14 bg-secondary-dark p-10 rounded-2xl shadow-xl border border-card-dark">

    <h2 class="text-3xl font-black text-accent-luxury tracking-wider mb-6">Mock Payment</h2>

    <p class="text-gray-300 text-lg mb-4">Payment ID:</p>
    <p class="text-xl font-bold text-white mb-6">{{ payment.payment_id }}</p>

    <p class="text-gray-300 text-lg mb-2">Amount to Pay:</p>
    <p class="text-3xl font-black text-accent-luxury mb-10">₹{{ payment.amount }}</p>

    <div class="flex flex-col sm:flex-row gap-6">

        <!-- Success -->
        <a href="{% url 'payment_success' payment.payment_id %}"
           class="w-full text-center bg-green-700 hover:bg-green-600 px-6 py-3 text-lg font-semibold rounded-xl transition shadow-lg">
            Complete Payment
        </a>

        <!-- Fail -->
        <a href="{% url 'payment_failed' payment.payment_id %}"
           class="w-full text-center bg-red-700 hover:bg-red-600 px-6 py-3 text-lg font-semibold rounded-xl transition shadow-lg">
            Fail Payment
        </a>

    </div>

</div>

{% endblock %}
