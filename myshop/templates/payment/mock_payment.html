{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto mt-16 bg-secondary-dark p-10 rounded-3xl shadow-2xl border border-card-dark">

    <!-- HEADER -->
    <h2 class="text-4xl font-extrabold text-accent-luxury tracking-wider mb-8 text-center">
        Mock Payment Gateway
    </h2>

    <!-- PAYMENT INFO -->
    <div class="mb-8 space-y-4 text-center">
        <div>
            <p class="text-gray-400 text-lg">Payment ID</p>
            <p class="text-xl font-semibold text-gray-100 break-all">{{ payment.payment_id }}</p>
        </div>

        <div>
            <p class="text-gray-400 text-lg">Amount to Pay</p>
            <p class="text-3xl font-black text-accent-luxury">₹{{ payment.amount }}</p>
        </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="flex flex-col sm:flex-row gap-6 justify-center">
        
        <!-- COMPLETE PAYMENT -->
        <a href="{% url 'payment_success' payment.payment_id %}" 
           class="flex-1 text-center bg-green-600 hover:bg-green-500 text-white font-bold text-lg py-4 rounded-2xl shadow-lg transition transform hover:scale-105">
            ✅ Complete Payment
        </a>

        <!-- FAIL PAYMENT -->
        <a href="{% url 'payment_failed' payment.payment_id %}" 
           class="flex-1 text-center bg-red-600 hover:bg-red-500 text-white font-bold text-lg py-4 rounded-2xl shadow-lg transition transform hover:scale-105">
            ❌ Fail Payment
        </a>

    </div>

    <!-- NOTE -->
    <p class="mt-6 text-center text-gray-400 text-sm">
        This is a mock payment page. No real transaction will be processed.
    </p>

</div>

{% endblock %}
