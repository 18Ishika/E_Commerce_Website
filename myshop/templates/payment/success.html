{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto mt-20 bg-secondary-dark p-10 rounded-2xl shadow-xl border border-green-700">

    <h2 class="text-4xl font-black text-green-500 mb-6 tracking-wide">Payment Successful! 🎉</h2>

    <p class="text-gray-300 text-lg mb-3">Payment ID:</p>
    <p class="text-xl font-bold text-white mb-6">{{ payment.payment_id }}</p>

    <p class="text-gray-300 text-lg mb-2">Amount Paid:</p>
    <p class="text-3xl font-black text-accent-luxury mb-10">₹{{ payment.amount }}</p>

    <a href="{% url 'product_list' %}"
       class="inline-block bg-accent-luxury hover:bg-accent-hover text-primary-dark px-6 py-3 rounded-xl text-lg font-bold transition shadow-lg">
        Continue Shopping
    </a>

</div>

{% endblock %}
