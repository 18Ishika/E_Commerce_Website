{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto mt-20 bg-secondary-dark p-10 rounded-2xl shadow-2xl border border-green-600 relative overflow-hidden">

    <!-- Decorative Confetti (optional animation placeholder) -->
    <div class="absolute inset-0 pointer-events-none">
        <!-- You can later add CSS animations or images for confetti -->
    </div>

    <h2 class="text-4xl font-extrabold text-green-500 mb-6 tracking-wide text-center">
        Payment Successful! 🎉
    </h2>

    <div class="bg-primary-dark p-6 rounded-xl mb-8 shadow-inner border border-green-700">
        <p class="text-gray-300 text-lg">Payment ID:</p>
        <p class="text-xl font-bold text-white mb-4">{{ payment.payment_id }}</p>

        <p class="text-gray-300 text-lg">Amount Paid:</p>
        <p class="text-3xl font-black text-accent-luxury">₹{{ payment.amount }}</p>
    </div>

    <div class="text-center">
        <a href="{% url 'product_list' %}"
           class="inline-block bg-accent-luxury hover:bg-accent-hover text-primary-dark font-bold px-8 py-3 rounded-2xl text-lg transition shadow-lg transform hover:scale-[1.02]">
            Continue Shopping
        </a>
    </div>

</div>

{% endblock %}
