{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto py-12 max-w-3xl">
    <h2 class="text-3xl font-extrabold mb-8 text-accent-luxury border-b border-card-dark pb-3">
        Update Order Status
    </h2>

    <div class="bg-secondary-dark p-8 rounded-2xl shadow-2xl border border-card-dark">

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <!-- Order Info -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block font-semibold text-gray-300 mb-1">Order ID</label>
                    <input type="text" class="w-full p-3 rounded-lg border border-card-dark bg-primary-dark text-gray-200"
                           value="{{ order.id }}" disabled>
                </div>
                <div>
                    <label class="block font-semibold text-gray-300 mb-1">User</label>
                    <input type="text" class="w-full p-3 rounded-lg border border-card-dark bg-primary-dark text-gray-200"
                           value="{{ order.user.username }}" disabled>
                </div>
                <div class="md:col-span-2">
                    <label class="block font-semibold text-gray-300 mb-1">Current Status</label>
                    <input type="text" class="w-full p-3 rounded-lg border border-card-dark bg-primary-dark text-gray-200"
                           value="{{ order.get_current_status_display }}" disabled>
                </div>
            </div>

            <!-- Status Dropdown -->
            <div>
                <label class="block font-semibold text-gray-300 mb-1">Update Status</label>
                <select name="status" required
                        class="w-full p-3 rounded-lg border border-card-dark bg-primary-dark text-gray-200 focus:ring-2 focus:ring-accent-luxury">
                    <option value="">Select New Status</option>
                    <option value="SHIPPED">Shipped</option>
                    <option value="OUT_FOR_DELIVERY">Out for Delivery</option>
                    <option value="DELIVERED">Delivered</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </div>

            <!-- Optional Note -->
            <div>
                <label class="block font-semibold text-gray-300 mb-1">Optional Note</label>
                <textarea name="note" rows="4" placeholder="Add shipment note or tracking details..."
                          class="w-full p-3 rounded-lg border border-card-dark bg-primary-dark text-gray-200 resize-none focus:ring-2 focus:ring-accent-luxury"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="text-right">
                <button type="submit"
                        class="bg-accent-luxury hover:bg-accent-hover text-primary-dark font-bold px-6 py-3 rounded-xl shadow-lg transition transform hover:scale-[1.02]">
                    Update Status
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
