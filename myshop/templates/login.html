{% extends "base.html" %}
{% block title %} Login {% endblock %}

{% block content %}

<div class="flex justify-center items-center mt-16">
    <div class="bg-secondary-dark p-10 rounded-xl shadow-xl w-full max-w-md border border-card-dark">

        <h2 class="text-3xl font-bold text-accent-luxury mb-6 text-center tracking-wide">
            Login
        </h2>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <!-- Username -->
            <div>
                <label class="block mb-2 font-semibold text-gray-300">Username</label>
                <input 
                    type="text" 
                    name="username"
                    required
                    class="w-full p-3 rounded-lg bg-card-dark text-white border border-gray-600 focus:border-accent-luxury focus:ring-1 focus:ring-accent-luxury outline-none transition"
                >
            </div>

            <!-- Password -->
            <div>
                <label class="block mb-2 font-semibold text-gray-300">Password</label>
                <input 
                    type="password" 
                    name="password"
                    required
                    class="w-full p-3 rounded-lg bg-card-dark text-white border border-gray-600 focus:border-accent-luxury focus:ring-1 focus:ring-accent-luxury outline-none transition"
                >
            </div>

            <!-- Error messages -->
            {% if messages %}
                {% for msg in messages %}
                    <p class="text-red-500 text-sm">{{ msg }}</p>
                {% endfor %}
            {% endif %}

            <!-- Submit Button -->
            <button 
                type="submit"
                class="w-full bg-accent-luxury hover:bg-yellow-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-300"
            >
                Login
            </button>

        </form>

    </div>
</div>

{% endblock %}
