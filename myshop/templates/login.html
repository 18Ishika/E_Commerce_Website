{% extends "base.html" %}
{% block title %} Login to Shopzee {% endblock %}

{% block content %}

<div class="flex justify-center items-center py-16 px-4">
    <div class="bg-secondary-dark p-10 sm:p-12 rounded-2xl shadow-3xl w-full max-w-md border border-card-dark transform hover:shadow-accent-luxury/30 transition duration-500">

        <h2 class="text-4xl font-extrabold text-accent-luxury mb-8 text-center tracking-wider">
            Welcome Back!
        </h2>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="id_username" class="block mb-2 font-semibold text-gray-300">Username</label>
                <input 
                    type="text" 
                    id="id_username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    class="w-full p-3 rounded-lg bg-card-dark text-gray-200 border border-gray-600 focus:border-accent-luxury focus:ring-2 focus:ring-accent-luxury outline-none transition duration-200"
                >
            </div>

            <div>
                <label for="id_password" class="block mb-2 font-semibold text-gray-300">Password</label>
                <input 
                    type="password" 
                    id="id_password"
                    name="password"
                    placeholder="••••••••"
                    required
                    class="w-full p-3 rounded-lg bg-card-dark text-gray-200 border border-gray-600 focus:border-accent-luxury focus:ring-2 focus:ring-accent-luxury outline-none transition duration-200"
                >
            </div>

            {% if messages %}
                <div class="space-y-2">
                    {% for msg in messages %}
                        <p class="p-3 bg-red-800 rounded-lg text-white font-medium text-sm border border-red-500">{{ msg }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <button 
                type="submit"
                class="w-full bg-accent-luxury hover:bg-accent-hover text-primary-dark font-black py-3 rounded-lg shadow-xl transition duration-300 text-lg uppercase mt-8 transform hover:scale-[1.01]"
            >
                Secure Login
            </button>

        </form>

        <div class="text-center mt-6 pt-4 border-t border-card-dark/50">
            <p class="text-gray-400">
                Don't have an account? 
                <a href="{% url 'buyer_signup' %}" class="text-accent-luxury hover:text-accent-hover font-semibold transition duration-200">
                    Sign Up Now
                </a>
            </p>
            
        </div>

    </div>
</div>

{% endblock %}
