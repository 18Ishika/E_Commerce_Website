{% extends "base.html" %}
{% block title %} Login to Shopzy {% endblock %}

{% block content %}

<div class="min-h-[80vh] flex items-center justify-center px-4">

    <div class="relative w-full max-w-md">

        <!-- Glow -->
        <div class="absolute -inset-1 rounded-3xl bg-accent-luxury/20 blur-2xl"></div>

        <!-- Card -->
        <div class="relative bg-secondary-dark p-10 sm:p-12 rounded-3xl shadow-2xl border border-card-dark">

            <h2 class="text-4xl font-extrabold text-accent-luxury mb-2 text-center tracking-widest">
                Welcome Back
            </h2>
            <p class="text-center text-gray-400 mb-8">
                Sign in to continue shopping on <span class="text-accent-hover font-semibold">Shopzy</span>
            </p>

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <!-- Username -->
                <div class="space-y-1">
                    <label for="id_username" class="text-sm font-semibold text-gray-300">Username</label>
                    <input
                        type="text"
                        id="id_username"
                        name="username"
                        placeholder="your_username"
                        required
                        class="w-full px-4 py-3 rounded-xl bg-card-dark text-gray-200 border border-card-dark focus:border-accent-luxury focus:ring-2 focus:ring-accent-luxury outline-none transition"
                    >
                </div>

                <!-- Password -->
                <div class="space-y-1">
                    <label for="id_password" class="text-sm font-semibold text-gray-300">Password</label>
                    <input
                        type="password"
                        id="id_password"
                        name="password"
                        placeholder="••••••••"
                        required
                        class="w-full px-4 py-3 rounded-xl bg-card-dark text-gray-200 border border-card-dark focus:border-accent-luxury focus:ring-2 focus:ring-accent-luxury outline-none transition"
                    >
                </div>

                <!-- Messages -->
                {% if messages %}
                <div class="space-y-2">
                    {% for msg in messages %}
                    <div class="p-3 rounded-xl text-sm font-semibold bg-red-800/80 border border-red-500 text-white">
                        {{ msg }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                <!-- Button -->
                <button
                    type="submit"
                    class="w-full mt-6 bg-accent-luxury hover:bg-accent-hover text-primary-dark font-black py-3 rounded-xl shadow-xl transition transform hover:scale-[1.02] uppercase tracking-wider"
                >
                    Login Securely
                </button>

            </form>

            <!-- Footer -->
            <div class="mt-8 pt-6 border-t border-card-dark text-center">
                <p class="text-gray-400">
                    New to Shopzy?
                    <a href="{% url 'buyer_signup' %}" class="ml-1 text-accent-luxury hover:text-accent-hover font-bold transition">
                        Create an account
                    </a>
                </p>
            </div>

        </div>
    </div>
</div>

{% endblock %}
